name: pyme_app
description: "Aplicación Flutter para gestionar inventario y ventas de una pyme distribuidora de productos de oficina."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: 6.1.5+1
  sqflite: 2.4.6
  path: 1.9.1
  shared_preferences: 2.5.6
  crypto: 3.0.8
  http: 1.6.0
  flutter_local_notifications: 23.0.4
  google_maps_flutter: 2.19.0
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
